<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Newton — o soco na cara (Fernando K). Retrato Godfrey Kneller, 1689 (domínio público) + raquete de badminton -->
  <defs>
    <clipPath id="ring"><circle cx="32" cy="32" r="30"/></clipPath>
    <clipPath id="head"><ellipse cx="47" cy="26" rx="8" ry="10.5" transform="rotate(38 47 26)"/></clipPath>
  </defs>

  <!-- portrait clipped to circle -->
  <image href="data:image/jpeg;base64," x="2" y="2" width="60" height="60"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#ring)"/>

  <!-- subtle vignette so the racket reads on top -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="4" clip-path="url(#ring)"/>

  <!-- ===== Badminton racket (held up, lower-right → upper-right) ===== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- handle + grip -->
    <line x1="34" y1="52" x2="44" y2="35" stroke="#0b3d2c" stroke-width="4.2"/>
    <line x1="34" y1="52" x2="44" y2="35" stroke="#12694b" stroke-width="2.2"/>
    <!-- throat -->
    <path d="M43 36 L41.5 31 M45.2 34.5 L48 30" fill="none" stroke="#e8eef0" stroke-width="1.6"/>
    <!-- head frame -->
    <ellipse cx="47" cy="26" rx="8" ry="10.5" transform="rotate(38 47 26)"
             fill="#ffffff" fill-opacity="0.10" stroke="#e8eef0" stroke-width="1.9"/>
    <!-- strings -->
    <g clip-path="url(#head)" stroke="#dfe7ea" stroke-width="0.55" stroke-opacity="0.9">
      <line x1="38" y1="16" x2="52" y2="30"/>
      <line x1="40" y1="14" x2="55" y2="29"/>
      <line x1="42" y1="13" x2="57" y2="28"/>
      <line x1="44" y1="12.5" x2="58" y2="27"/>
      <line x1="35" y1="19" x2="49" y2="33"/>
      <line x1="55" y1="18" x2="41" y2="32"/>
      <line x1="57" y1="20" x2="43" y2="34"/>
      <line x1="53" y1="16" x2="39" y2="30"/>
      <line x1="51" y1="14.5" x2="37" y2="28.5"/>
      <line x1="49" y1="13.5" x2="36" y2="26"/>
    </g>
  </g>

  <!-- ===== Shuttlecock (flying in, upper-left) ===== -->
  <g stroke-linejoin="round">
    <!-- feather skirt -->
    <path d="M14 14 L9 8 M16 13 L13 6 M18 13 L18 5.5 M20 13.5 L23 6.5 M22 15 L27 9"
          fill="none" stroke="#f4f6f7" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M13 15 L23 15.8 L21.5 20 L14.5 19.5 Z" fill="#f4f6f7" fill-opacity="0.85"/>
    <!-- cork -->
    <circle cx="18" cy="21.5" r="3" fill="#e23b2e" stroke="#a51f15" stroke-width="0.8"/>
  </g>

  <!-- crisp outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#d4a72c" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#8a6a12" stroke-width="0.8"/>
</svg>
