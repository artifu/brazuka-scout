<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tipo Ronaldo injury badge — R9 fenômeno, joelho com band-aid (não é bandeira!) -->
  <circle cx="32" cy="32" r="30" fill="#7C3AED" stroke="#5B21B6" stroke-width="2.5"/>
  <!-- Head (bald, brown skin) -->
  <ellipse cx="32" cy="25" rx="13" ry="14" fill="#C4855A"/>
  <!-- Famous R9 haircut: triangle patch on front of bald head -->
  <path d="M25,15 Q32,9 39,15 Q35,19 29,19 Z" fill="#1F2937"/>
  <!-- Eyes -->
  <circle cx="27" cy="24" r="2.5" fill="white"/>
  <circle cx="37" cy="24" r="2.5" fill="white"/>
  <circle cx="27.6" cy="24.5" r="1.3" fill="#1F2937"/>
  <circle cx="37.6" cy="24.5" r="1.3" fill="#1F2937"/>
  <!-- Big Ronaldo buck-tooth smile -->
  <path d="M25,30 Q32,36 39,30 Z" fill="white" stroke="#1F2937" stroke-width="1"/>
  <line x1="31" y1="31.2" x2="31" y2="34.6" stroke="#1F2937" stroke-width="0.8"/>
  <line x1="33" y1="31.2" x2="33" y2="34.6" stroke="#1F2937" stroke-width="0.8"/>
  <!-- Body / torso (yellow BR jersey) -->
  <rect x="23" y="38" width="18" height="11" rx="3" fill="#FCD116"/>
  <!-- Legs -->
  <rect x="26" y="49" width="5" height="9" rx="2" fill="#C4855A"/>
  <rect x="33" y="49" width="5" height="9" rx="2" fill="#C4855A"/>
  <!-- Band-aid on the knee: two crossed tan strips with dots -->
  <g transform="rotate(35 28.5 53)">
    <rect x="22.5" y="50.4" width="12" height="5" rx="2.5" fill="#D8A878"/>
    <rect x="27" y="51.3" width="3" height="3.2" rx="0.6" fill="#EACAA3"/>
  </g>
  <g transform="rotate(-35 28.5 53)">
    <rect x="22.5" y="50.4" width="12" height="5" rx="2.5" fill="#E6B98C"/>
    <rect x="27" y="51.3" width="3" height="3.2" rx="0.6" fill="#F3D6B5"/>
    <circle cx="24.6" cy="51.7" r="0.5" fill="#B98A5E"/>
    <circle cx="24.6" cy="54.1" r="0.5" fill="#B98A5E"/>
    <circle cx="32.4" cy="51.7" r="0.5" fill="#B98A5E"/>
    <circle cx="32.4" cy="54.1" r="0.5" fill="#B98A5E"/>
  </g>
</svg>
